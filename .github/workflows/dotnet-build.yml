name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"
  DOTNET_OBJ_CACHE: "dotnet-obj-${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}"
  JS_DIST_CACHE: "js-dist-${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request_target:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "Specifications/**"
      - ".github/workflows/dotnet-build.yml"

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    outputs:
      proxy-namespaces: ${{ steps.discover-namespaces.outputs.namespaces }}
      spec-projects: ${{ steps.discover-specs.outputs.projects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Discover ProxyGenerator spec namespaces
        id: discover-namespaces
        run: |
          namespaces=$(grep -rh "^namespace " Source/DotNET/Tools/ProxyGenerator.Specs --include="*.cs" \
            | sed 's/^namespace //; s/;//' \
            | awk -F. '{
                for (i=1; i<=NF; i++) {
                  if ($i ~ /^for_/) {
                    r=$1; for (j=2; j<=i; j++) r=r"."$j
                    print r
                    break
                  }
                }
              }' \
            | sort -u \
            | jq -Rc '.' \
            | jq -sc '.')
          echo "namespaces=$namespaces" >> "$GITHUB_OUTPUT"

      - name: Discover spec projects
        id: discover-specs
        run: |
          projects=$(find Source/DotNET -name "*.Specs.csproj" ! -name "ProxyGenerator.Specs.csproj" \
            | sed 's|/[^/]*\.csproj$||' \
            | sort \
            | jq -Rc '.' \
            | jq -sc '.')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore obj cache
        uses: actions/cache@v6
        with:
          path: ./**/obj
          key: ${{ env.DOTNET_OBJ_CACHE }}
          restore-keys: |
            dotnet-obj-

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            node_modules
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Cache JavaScript dist output
        uses: actions/cache@v6
        with:
          path: Source/JavaScript/**/dist
          key: ${{ env.JS_DIST_CACHE }}

      - name: Build
        run: dotnet build --configuration Release

      # Hand off the compiled binaries to the spec jobs via an artifact rather than
      # actions/cache. The bin output is an intra-run handoff, not cross-run reuse:
      # actions/cache keys on the immutable commit SHA, so a single flaky save
      # (reservation collision on the large ./**/bin cache) permanently poisons the
      # key and every --no-build spec job fails with "cache not found". Artifacts are
      # the correct primitive for passing build output between jobs in the same run.
      - name: Archive build output
        run: |
          find . -type d -name bin -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
            | tar --null -czf build-output.tar.gz -T -

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 1
          if-no-files-found: error

  specs:
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.dotnet-build.outputs.spec-projects) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -xzf build-output.tar.gz

      - name: Test (${{ matrix.project }})
        run: dotnet test ${{ matrix.project }} --no-build --configuration Release --framework net10.0

  proxy-specs:
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        namespace: ${{ fromJson(needs.dotnet-build.outputs.proxy-namespaces) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Restore node modules
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Restore JavaScript dist output
        uses: actions/cache@v6
        with:
          path: Source/JavaScript/**/dist
          key: ${{ env.JS_DIST_CACHE }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -xzf build-output.tar.gz

      - name: Test (${{ matrix.namespace }})
        run: |
          dotnet test Source/DotNET/Tools/ProxyGenerator.Specs \
            --no-build \
            --configuration Release \
            --framework net10.0 \
            --filter "FullyQualifiedName~${{ matrix.namespace }}" \
            --logger "console;verbosity=normal"
