name: .NET Build

# PR builds run under pull_request and build the PR head. Group by pull request when there is one,
# otherwise by ref, so a newer PR run cancels only the older run for the same pull request.
# Runs on main (push and manual) are never cancelled: a burst of merges queues, GitHub keeps only the newest
# pending run, and that run verifies the latest main. Cancelling would leave main unverified while merges keep coming.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  # Pull request runs build the pull request head, not its merge with main, so two pull requests that are each
  # green can still break main together. The push run builds and specs main itself after every merge, and the
  # report-main job opens (or updates) one main-broken issue when it fails and closes it when main is green again.
  push:
    branches:
      - main
    paths:
      - "Source/DotNET/**"
      - "Specifications/**"
      - "Samples/**"
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "global.json"
      - "stylecop.json"
      - "Arc.slnx"
      - ".github/workflows/dotnet-build.yml"
      - ".github/test-shards.json"
      - "scripts/ci-test-shards.py"
      - "scripts/viewer-bundle.test.mjs"
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "Specifications/**"
      - "Samples/**"
      # What the build compiles against, not only what it compiles. A package
      # version bump touches none of the paths above, so it used to reach main
      # without ever having been built - which is how a Chronicle release that
      # added members to an interface Arc implements got merged unbuilt.
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "global.json"
      - "stylecop.json"
      - "Arc.slnx"
      - ".github/workflows/dotnet-build.yml"
      - ".github/test-shards.json"
      - "scripts/ci-test-shards.py"
      - "scripts/viewer-bundle.test.mjs"

# PR builds run with a read-only token, and checkouts do not keep credentials.
# PR runs restore caches but never save them. Only the main-only reporting job declares write permissions.
permissions:
  contents: read

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      proxy-shards: ${{ steps.test-shards.outputs.proxy-shards }}
      spec-shards: ${{ steps.test-shards.outputs.spec-shards }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The specs run in a few shards rather than one job per ProxyGenerator.Specs 'for_' namespace and per spec
      # project; the per-job setup and artifact download cost several times what the tests did. The assignment lives
      # in .github/test-shards.json, balanced by measured test time (the runs it came from are recorded there).
      # This fails before the build when a namespace or spec project is in no shard, in two, or no longer exists, so
      # a new one cannot silently drop out of the run.
      - name: Verify the test shard assignment
        id: test-shards
        run: |
          set -euo pipefail
          python3 scripts/ci-test-shards.py --self-test
          python3 scripts/ci-test-shards.py check
          python3 scripts/ci-test-shards.py matrix >> "$GITHUB_OUTPUT"

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      # This workflow only restores the shared caches, also when it runs on main: warm-caches.yml is the one place
      # that saves them, so pull request code never writes a cache.
      # It runs before anything adds .props or .targets files (obj, node_modules) that its key hashes.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      # Restore only, like the NuGet cache above.
      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main
        with:
          mode: restore

      - name: Yarn install
        run: yarn install --immutable

      - name: Build and test embedded event-model viewer
        working-directory: Source/DotNET/Screenplay.Embedded
        run: |
          npm ci --workspaces=false
          npm run typecheck
          npm test
          npm run build
          node --test ../../../scripts/viewer-bundle.test.mjs

      # Every spec job below runs net10.0 only, so the spec projects and their fixtures are compiled for net10.0 only
      # (Directory.Build.props). The libraries still build for net8.0, net9.0 and net10.0.
      - name: Build
        run: dotnet build --configuration Release -p:CratisSpecsTargetFramework=net10.0

      # Hand off the compiled binaries AND the JavaScript dist output to the spec jobs
      # via an artifact rather than actions/cache. This is an intra-run handoff, not
      # cross-run reuse: actions/cache keys on the immutable commit SHA, so a single
      # flaky save (reservation collision) permanently poisons the key and every
      # --no-build spec job fails with "cache not found" — and a re-run cannot recover
      # because the key is fixed to the SHA. The proxy-specs jobs execute generated
      # proxies against Source/JavaScript/**/dist (e.g. Arc/dist/cjs/index.js), so that
      # output must ride along in the same artifact. Artifacts are the correct primitive
      # for passing build output between jobs in the same run.
      # zstd on every core packs the ~1.3 GB tree in a fraction of the time gzip took, and the archive is
      # already compressed, so the upload stores it as is (compression-level 0) instead of compressing it again.
      - name: Archive build output
        run: |
          set -euo pipefail
          {
            find . -type d -name bin -not -path '*/node_modules/*' -not -path './.git/*' -print0
            find Source/JavaScript -type d -name dist -not -path '*/node_modules/*' -print0
          } | tar --null -I 'zstd -T0' -cf build-output.tar.zst -T -
          ls -l build-output.tar.zst

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  specs:
    name: ${{ matrix.shard }}
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.dotnet-build.outputs.spec-shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The specs run on net10.0 only, so the shard needs only that runtime; the build job keeps 8, 9 and 10.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET10_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -I zstd -xf build-output.tar.zst

      # Ordinary specs use their prebuilt xUnit executables. Proxy shards retain VSTest namespace filtering.
      # The runner rejects existing result directories and incomplete TRX; a failing project does not stop the shard.
      - name: Test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-shards.py run --shard "$SHARD" --configuration Release --results "$RUNNER_TEMP/test-results"

      # Retain per-project population reporting in addition to the executable runner's strict TRX validation.
      - name: Verify every project ran tests
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-shards.py verify-trx --shard "$SHARD" --results "$RUNNER_TEMP/test-results"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  # Every Screenplay specification builds its compilation from source strings, which is what makes them hermetic -
  # and what puts a whole class of defect out of their reach by construction. A compilation built that way has no
  # intermediate folder, no source generator output on disk and no referenced package declaring an event, so a
  # generator that mis-attributes one of those produces a wrong document that every specification still passes. Two
  # shipped that way. This reads a real project through MSBuild and compiles and binds its document with the language
  # compiler and semantic binder. Both modes accept only known admission and legacy-consistency message shapes,
  # not every PLAY0268. SP0056 at any severity and all unexpected binding errors fail. Syntax warnings fail too.
  # The samples can currently emit identical bytes in both modes; these runs exercise the option on real MSBuild compilations,
  # while Screenplay.Specs' authoring fixtures exercise the additional operations, routes, reads and provisioning.
  screenplay-end-to-end:
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      # This job restores only the samples, so it never saves the shared cache, even when run by hand on main.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -I zstd -xf build-output.tar.zst

      # The build output artifact carries bin folders only, and reading a project through MSBuild needs the assets
      # file that restore writes to obj.
      - name: Restore the applications to generate from
        run: |
          dotnet restore Samples/AspNetCore/AspNetCore.csproj
          dotnet restore Samples/Chronicle/Chronicle.csproj
          dotnet restore Samples/Layered/Layered.csproj

      - name: Generate and read back the document of a real application
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/AspNetCore/AspNetCore.csproj \
            "${RUNNER_TEMP}/AspNetCore.play"

      - name: Generate and bind the authoring document of a real application
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/AspNetCore/AspNetCore.csproj \
            "${RUNNER_TEMP}/AspNetCore-authoring.play" \
            --authoring-only-constructs

      # Everything an event sourced application declares - events, the constants a projection sets and the scenarios
      # a slice is specified by - lives in the Chronicle application, which is a second application rather than more
      # of the first one, so its document is generated and read back on its own.
      - name: Generate and read back the document of a real event sourced application
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/Chronicle/Chronicle.csproj \
            "${RUNNER_TEMP}/Chronicle.play"

      - name: Generate and bind the authoring document of a real event sourced application
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/Chronicle/Chronicle.csproj \
            "${RUNNER_TEMP}/Chronicle-authoring.play" \
            --authoring-only-constructs

      # The two applications above are each one project, and a whole class of defect only exists between projects: a
      # referenced project arrives as the compilation the workspace built rather than as an assembly on disk, so its
      # declarations have real source belonging to a compilation that is not the one reading them. Two defects
      # shipped through that gap and neither was reachable from here until this application existed. It is held to
      # what its document says as well as to reading back clean, because a generator that quietly declines to read
      # something writes a smaller document that compiles just as well.
      - name: Generate and read back the document of a real application written as several projects
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/Layered/Layered.csproj \
            "${RUNNER_TEMP}/Layered.play" \
            Samples/Layered/Layered.expected

      # Layered expectations describe default emission, not the additional authoring constructs.
      - name: Generate and bind the authoring document of a real application written as several projects
        run: |
          dotnet Source/DotNET/Screenplay.EndToEnd/bin/Release/net10.0/Cratis.Arc.Screenplay.EndToEnd.dll \
            Samples/Layered/Layered.csproj \
            "${RUNNER_TEMP}/Layered-authoring.play" \
            --authoring-only-constructs

  proxy-specs:
    name: ${{ matrix.shard }}
    needs: [dotnet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.dotnet-build.outputs.proxy-shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The specs run on net10.0 only, so the shard needs only that runtime; the build job keeps 8, 9 and 10.
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET10_VERSION }}

      # The template contract specs lint generated output with the real ESLint toolchain.
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      - name: Enable corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main
        with:
          mode: restore

      - name: Yarn install
        run: yarn install --immutable

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -I zstd -xf build-output.tar.zst

      # The shard's filter ORs together the FullyQualifiedName~<namespace> filters of the jobs it replaces.
      - name: Test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-shards.py run --shard "$SHARD" --configuration Release --results "$RUNNER_TEMP/test-results"

      # A filter that matches nothing can pass the runner; this fails the shard when any of its namespaces ran no
      # tests and prints each namespace's count.
      - name: Verify every namespace ran tests
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci-test-shards.py verify-trx --shard "$SHARD" --results "$RUNNER_TEMP/test-results"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  # Only for runs on main: a failure opens one main-broken issue (or comments on the open one) naming the commits
  # since the last green run on main, and the next green run closes it. Pull request runs skip this job.
  report-main:
    needs: [dotnet-build, specs, screenplay-end-to-end, proxy-specs]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Open, update or close the main-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          open_issue=$(gh issue list --label main-broken --state open --limit 1 --json number --jq '.[0].number // empty')
          failed=0
          for result in $RESULTS; do
            [ "$result" = success ] || failed=1
          done
          if [ "$failed" = 0 ]; then
            echo "main is green at $SHA (results: $RESULTS)"
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --reason completed --comment "main builds and passes its specs again at $SHA: $RUN_URL"
            fi
            exit 0
          fi
          last_green=$(gh run list --workflow dotnet-build.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -n "$last_green" ]; then
            range="Commits since the last green run on main: ${GITHUB_SERVER_URL}/${GH_REPO}/compare/${last_green}...${SHA}"
          else
            range="No earlier green run on main was found."
          fi
          body=$(printf '%s\n\n%s\n%s\n%s\n' \
            "The .NET Build on main failed at $SHA (job results: $RESULTS)." \
            "Run: $RUN_URL" \
            "$range" \
            "Two pull requests that were each green can break main together; check the merges in that range.")
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh label create main-broken --color B60205 --description "main fails its build or specs after a merge" --force
            gh issue create --title "main is broken: .NET Build fails after merge" --label main-broken --body "$body"
          fi
          echo "::error title=main is broken::.NET Build failed on main at $SHA"
          exit 1
