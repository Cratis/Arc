name: JavaScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/JavaScript/**"
      - "run-task-on-workspaces.js"
      - "scripts/workspace-publish-order.cjs"
      - "scripts/workspace-version-is-published.cjs"
      - "scripts/workspace-publish-retry.test.cjs"
      - "scripts/run-task-on-workspaces.test.cjs"
      - "scripts/rollup-node-externals.test.mjs"
      - "scripts/fixtures/workspace-runner.cjs"
      - "scripts/check-declaration-imports.cjs"
      - "scripts/check-declaration-consumers.cjs"
      - "scripts/fixtures/declaration-consumer/**"
      - ".github/workflows/javascript-build.yml"
      - "tsconfig.json"
      - "tsconfig.specs.json"
      - "rollup.config.mjs"
      - "vite.base.mts"
      - "scripts/vite-config.test.mjs"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      # Pull requests only restore; warm-caches.yml saves the cache on main.
      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main

      - name: Yarn install
        run: yarn install --immutable

      - name: Verify Vite configuration and native aliases
        run: node --test scripts/vite-config.test.mjs

      - name: Verify workspace publishing
        run: node --test scripts/run-task-on-workspaces.test.cjs

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci
          node --test scripts/rollup-node-externals.test.mjs
          yarn node scripts/check-declaration-imports.cjs --self-test
          yarn node scripts/check-declaration-imports.cjs
          yarn node scripts/check-declaration-consumers.cjs
