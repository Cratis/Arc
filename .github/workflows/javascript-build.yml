name: JavaScript Build

# Called from pull-requests.yml; the PR triggers and path filters live there.
concurrency:
  group: javascript-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  workflow_call:

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run guard checks from the base revision so a pull request cannot change the check that judges it.
      # Check out the guards before dependency installation or any other PR code runs.
      - name: Checkout gate tools
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: gate-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      # Pull requests only restore; warm-caches.yml saves the cache on main.
      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main

      - name: Yarn install
        run: yarn install --immutable

      - name: Verify Vite configuration and native aliases
        run: node --test scripts/vite-config.test.mjs

      - name: Verify workspace publishing
        run: node --test scripts/run-task-on-workspaces.test.cjs

      - name: Verify npm visibility polling
        run: node --test scripts/wait-for-npm-visibility.test.cjs

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci
          node --test scripts/rollup-node-externals.test.mjs
          yarn node scripts/check-declaration-imports.cjs --self-test
          node --test scripts/declaration-guard-roots.test.cjs

      - name: Verify declarations with base guards
        run: |
          set -euo pipefail
          for guard in check-declaration-imports.cjs check-declaration-consumers.cjs; do
            script="scripts/$guard"
            root_args=()
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              if [ -f "gate-tools/$script" ]; then
                echo "::notice::Running $guard from base revision $(git -C gate-tools rev-parse HEAD)."
                if grep -q -- '--repo-root' "gate-tools/$script"; then
                  script="gate-tools/$script"
                  root_args=(--repo-root "$GITHUB_WORKSPACE")
                else
                  # Older guards resolve inputs from __dirname; keep the base source, but use the PR input location.
                  echo "::notice::Bootstrap: base guard has no --repo-root; running its source beside PR inputs."
                  cp "gate-tools/$script" "scripts/.base-$guard"
                  if [ "$guard" = check-declaration-consumers.cjs ]; then
                    cp gate-tools/scripts/fixtures/declaration-consumer/consumer.{mts,cts} scripts/fixtures/declaration-consumer/
                  fi
                  script="scripts/.base-$guard"
                fi
              else
                echo "::notice::Bootstrap: base has no $guard; using event revision $(git rev-parse HEAD)."
              fi
            else
              echo "::notice::Running $guard from event revision $(git rev-parse HEAD)."
            fi
            yarn node "$script" "${root_args[@]}"
          done
