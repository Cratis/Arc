name: JavaScript Build

# Called from pull-requests.yml; the PR triggers and path filters live there.
concurrency:
  group: javascript-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  workflow_call:

permissions: {}

jobs:
  # Lints, builds and tests only the workspace packages the change reaches, in dependency order. A merge, the nightly run and a
  # shared input (the root package.json, lockfile or configuration, the build scripts) run every package.
  affected:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: Cratis/Workflows/.github/workflows/affected-frontend.yml@main
    with:
      node-version: 23.x
      node-options: --max-old-space-size=4096
      timeout-minutes: 30
      legs: |
        lint:ci@changed
        build,test
      global-paths: |
        scripts/**
        .github/workflows/javascript-build.yml
        .github/workflows/pull-requests.yml

  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      # Pull requests only restore; warm-caches.yml saves the cache on main.
      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main

      - name: Yarn install
        run: yarn install --immutable

      - name: Verify Vite configuration and native aliases
        run: node --test scripts/vite-config.test.mjs

      - name: Verify workspace publishing
        run: node --test scripts/run-task-on-workspaces.test.cjs

      - name: Verify npm visibility polling
        run: node --test scripts/wait-for-npm-visibility.test.cjs

      - name: Verify declaration guard roots
        run: node --test scripts/declaration-guard-roots.test.cjs

      - name: Verify extracted declaration guard tooling
        run: node --test scripts/guard-tooling.integration.test.mjs

      # Only what the declaration guards below read. Linting, building and testing every package is the `affected` job's work,
      # and it covers only the packages the change reaches (Cratis/Workflows affected-frontend.yml).
      - name: Build the packages the declaration guards check
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096"
          for package in Arc Arc.React Arc.React.MVVM Arc.Vite; do
            (cd "Source/JavaScript/$package" && yarn build)
          done
          node --test scripts/rollup-node-externals.test.mjs
          yarn node scripts/check-declaration-imports.cjs --self-test
          node --test scripts/declaration-guard-roots.test.cjs scripts/guard-job-layout.test.mjs

      - name: Upload declaration inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: declaration-inputs
          if-no-files-found: error
          retention-days: 1
          path: |
            Source/JavaScript/Arc/package.json
            Source/JavaScript/Arc/dist/**
            Source/JavaScript/Arc.React/package.json
            Source/JavaScript/Arc.React/dist/**
            Source/JavaScript/Arc.React.MVVM/package.json
            Source/JavaScript/Arc.React.MVVM/dist/**
            Source/JavaScript/Arc.Vite/package.json
            Source/JavaScript/Arc.Vite/dist/**

  # Run guard checks from the base revision so a pull request cannot change the check that judges it.
  # Builds run elsewhere; this job only reads their output with base-installed tooling.
  declaration-guards:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout head data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Extract base tools outside the head tree
        working-directory: ${{ runner.temp }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GUARD_SCRIPTS: scripts/check-declaration-imports.cjs scripts/check-declaration-consumers.cjs
          GUARD_FILES: scripts/declaration-guard-paths.cjs scripts/fixtures/declaration-consumer/consumer.mts scripts/fixtures/declaration-consumer/consumer.cts package.json yarn.lock .yarnrc.yml
        run: |
          set -euo pipefail
          tools_present() {
            for tool in $GUARD_SCRIPTS; do
              missing="$tool (--root)"
              if ! git -C "$GITHUB_WORKSPACE" show "$1:$tool" > "$RUNNER_TEMP/guard-candidate" 2>/dev/null; then return 1; fi
              if ! grep -q -- '--root' "$RUNNER_TEMP/guard-candidate"; then return 1; fi
            done
            for tool in $GUARD_FILES; do
              missing="$tool"
              if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$1:$tool" 2>/dev/null; then return 1; fi
            done
          }
          missing="${GUARD_SCRIPTS%% *}"
          revision=''
          if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] &&
             { git -C "$GITHUB_WORKSPACE" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
               git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BASE_SHA"; } &&
             tools_present "$BASE_SHA"; then
            revision="$BASE_SHA"
            echo "::notice::Selected base revision $revision."
          else
            remote=$(git -C "$GITHUB_WORKSPACE" remote get-url origin)
            revision=$(git -c credential.helper= -c http.extraheader= ls-remote --refs "$remote" "refs/heads/$DEFAULT_BRANCH" |
              awk -v ref="refs/heads/$DEFAULT_BRANCH" '$2 == ref { print $1 }') || revision=''
            if ! [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]] ||
               ! git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$revision" ||
               ! tools_present "$revision"; then
              echo "::error::Neither base nor default branch provides required gate tool: $missing"
              exit 1
            fi
            echo "::notice::Selected default branch $DEFAULT_BRANCH revision $revision."
          fi
          tools=$(mktemp -d "$RUNNER_TEMP/gate-tools.XXXXXX")
          git -C "$GITHUB_WORKSPACE" archive "$revision" | tar -x -C "$tools"
          echo "GATE_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "::notice::Running declaration guards and tooling from $revision."

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        working-directory: ${{ runner.temp }}
        run: corepack enable

      - name: Install base tooling
        working-directory: ${{ env.GATE_TOOLS }}
        run: yarn install --immutable

      - name: Download declaration inputs as data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: declaration-inputs
          # Upload preserves paths relative to the common Source/JavaScript ancestor.
          path: ${{ runner.temp }}/declaration-data/Source/JavaScript

      - name: Verify declarations with base guards
        working-directory: ${{ env.GATE_TOOLS }}
        run: |
          set -euo pipefail
          node scripts/check-declaration-imports.cjs --root "$RUNNER_TEMP/declaration-data"
          node scripts/check-declaration-consumers.cjs --root "$RUNNER_TEMP/declaration-data"
