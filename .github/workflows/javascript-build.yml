name: JavaScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/JavaScript/**"
      - "scripts/check-declaration-imports.cjs"
      - "scripts/check-declaration-consumers.cjs"
      - "scripts/fixtures/declaration-consumer/**"
      - ".github/workflows/javascript-build.yml"
      - "tsconfig.json"
      - "tsconfig.specs.json"
      - "rollup.config.mjs"
      - "vite.base.ts"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
  
      - name: Yarn install
        run: yarn

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci
          yarn node scripts/check-declaration-imports.cjs --self-test
          yarn node scripts/check-declaration-imports.cjs
          yarn node scripts/check-declaration-consumers.cjs
