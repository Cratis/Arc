name: Pull Requests

# One caller for every pull-request check so a single always-running `gate` job can require them all.
# A path-filtered workflow that never starts never reports; here each callee is skipped by `changes`
# instead, and a skipped job counts as passed in `gate`. Label and edit events re-run everything on
# purpose (the policy check needs them); heavy jobs must not be skipped on those events, because a
# cancelled code run would let a later run pass `gate` without having built anything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      aot: ${{ steps.filter.outputs.aot }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      javascript: ${{ steps.filter.outputs.javascript }}
      markdown: ${{ steps.filter.outputs.markdown }}
      package-graph: ${{ steps.filter.outputs.package-graph }}
      prerelease: ${{ steps.filter.outputs.prerelease }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      # The pull request files API lists at most 3,000 files, so a larger pull request could hide
      # changed paths from the filter and skip checks. Fail closed instead of filtering a partial list.
      - name: Refuse pull requests the filter cannot see in full
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "::error title=changes::This pull request changes $CHANGED_FILES files; split it so path filtering sees every file."
            exit 1
          fi
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            aot:
              - "Source/DotNET/**"
              - "Samples/ArcCore/**"
              - "Samples/Shared/**"
              - "Samples/ArcCore.Specs/**"
              - "Directory.Build.props"
              - "Directory.Build.targets"
              - "Directory.Packages*.props"
              - ".editorconfig"
              - "**/.editorconfig"
              - ".globalconfig"
              - "global.json"
              - "scripts/aot-ratchet.py"
              - "scripts/published-arccore-outcomes*.mjs"
              - ".github/workflows/aot-ratchet.yml"
              - ".github/workflows/pull-requests.yml"
            dotnet:
              - "Source/DotNET/**"
              - "Specifications/**"
              - "Samples/**"
              - "Directory.Build.props"
              - "Directory.Packages*.props"
              - "global.json"
              - "stylecop.json"
              - "Arc.slnx"
              - ".github/workflows/dotnet-build.yml"
              - ".github/workflows/pull-requests.yml"
              - ".github/test-shards.json"
              - "scripts/ci-test-shards.py"
              - "scripts/viewer-bundle.test.mjs"
            javascript:
              - "Source/JavaScript/**"
              - "run-task-on-workspaces.js"
              - "scripts/workspace-publish-order.cjs"
              - "scripts/workspace-version-is-published.cjs"
              - "scripts/workspace-publish-retry.test.cjs"
              - "scripts/wait-for-npm-visibility.cjs"
              - "scripts/wait-for-npm-visibility.test.cjs"
              - "scripts/run-task-on-workspaces.test.cjs"
              - "scripts/rollup-node-externals.test.mjs"
              - "scripts/fixtures/workspace-runner.cjs"
              - "scripts/check-declaration-imports.cjs"
              - "scripts/check-declaration-consumers.cjs"
              - "scripts/fixtures/declaration-consumer/**"
              - ".github/workflows/javascript-build.yml"
              - ".github/workflows/pull-requests.yml"
              - "tsconfig.json"
              - "tsconfig.specs.json"
              - "rollup.config.mjs"
              - "vite.base.mts"
              - "scripts/vite-config.test.mjs"
              - "package.json"
            markdown:
              - "Documentation/**"
              - "Source/DotNET/**"
              - ".github/workflows/markdown-verification.yml"
              - ".github/workflows/pull-requests.yml"
            package-graph:
              - "Source/DotNET/**/*.csproj"
              - "Source/DotNET/**/*.props"
              - "Source/DotNET/**/*.targets"
              - "Source/DotNET/*Generators*/**"
              - "Source/DotNET/*CodeAnalysis*/**"
              - "Source/DotNET/Shared/**"
              - "Source/DotNET/Cratis/**"
              - "Source/DotNET/Cratis.Testing/**"
              - "Source/DotNET/Screenplay.Embedded/**"
              - "Directory.Build.props"
              - "Directory.Packages*.props"
              - "global.json"
              - "stylecop.json"
              - "Arc.slnx"
              - ".github/workflows/package-graph-verification.yml"
              - ".github/workflows/pull-requests.yml"
            prerelease:
              - "Source/**"
              - ".github/workflows/**"
            lint:
              - ".github/workflows/**"
              - ".github/actions/**"
              - ".github/actionlint.yaml"
              - ".github/actionlint.yml"
              - "scripts/chronicle-published-inputs.test.mjs"

  aot-ratchet:
    needs: changes
    if: ${{ needs.changes.outputs.aot == 'true' && github.event.pull_request.base.ref == 'main' }}
    uses: ./.github/workflows/aot-ratchet.yml
    permissions:
      contents: read

  dotnet-build:
    needs: changes
    if: ${{ needs.changes.outputs.dotnet == 'true' }}
    uses: ./.github/workflows/dotnet-build.yml
    permissions:
      actions: read
      contents: read
      issues: write

  javascript-build:
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    uses: ./.github/workflows/javascript-build.yml
    permissions:
      contents: read

  markdown-verification:
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    uses: ./.github/workflows/markdown-verification.yml
    permissions:
      contents: read

  package-graph:
    needs: changes
    if: ${{ needs.changes.outputs.package-graph == 'true' && github.event.pull_request.base.ref == 'main' }}
    uses: ./.github/workflows/package-graph-verification.yml
    permissions:
      contents: read

  prerelease:
    needs: changes
    if: ${{ needs.changes.outputs.prerelease == 'true' }}
    uses: ./.github/workflows/pr-prerelease.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write

  workflow-lint:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    uses: ./.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  # No filter: the policy check must always run (its old trigger had no paths).
  policy:
    uses: ./.github/workflows/verify-pull-request-policy.yml
    permissions:
      contents: read
      pull-requests: write

  # Every other job in this file MUST be listed in `needs`: a job left out is invisible to the gate.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [changes, aot-ratchet, dotnet-build, javascript-build, markdown-verification, package-graph, prerelease, policy, workflow-lint]
    runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          # Fail closed: anything other than success or skipped (failure, cancelled, or a result we do not know) fails.
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success","skipped") | not) | .key')
          # `changes` is the only job that decides what is skipped, so it must have succeeded, never been skipped.
          [ "$(echo "$NEEDS" | jq -r '.changes.result')" = "success" ] || bad="$bad changes"
          if [ -n "${bad// /}" ]; then
            echo "::error title=gate::Failed, cancelled or unknown: $bad"
            exit 1
          fi
