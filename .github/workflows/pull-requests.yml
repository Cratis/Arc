name: PR Prerelase

# Run under pull_request and group by pull request so newer runs cancel only that PR's older prerelease.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  NUGET_SOURCE: https://nuget.pkg.github.com/cratis/index.json
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

# Default to read-only permissions; only the NuGet publishing and commenting job declares write permissions.
# Jobs that check out PR code run only for pull requests from this repository, never forks.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        id: release
        uses: cratis/release-action@v1

  publish-nuget-packages:
    if: needs.release.outputs.publish == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      # PR runs restore the shared caches but never save them.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: Cratis/Workflows/.github/actions/yarn-cache@main
        with:
          mode: restore

      - name: Yarn install
        run: yarn install --immutable

      # Screenplay.Embedded packs this generated viewer and deliberately refuses to pack without it.
      - name: Build embedded event-model viewer
        working-directory: Source/DotNET/Screenplay.Embedded
        run: |
          npm ci --workspaces=false
          npm run build

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}
      - name: Build
        run: dotnet build --configuration Debug

      - name: Add GitHub Package Registry to NuGet
        run: dotnet nuget add source --name github --username cratis --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text ${{ env.NUGET_SOURCE }}

      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Debug -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      - name: Push NuGet packages
        run: dotnet nuget push '${{ env.NUGET_OUTPUT }}/*.nupkg' --skip-duplicate --timeout 900 --api-key ${{ secrets.GITHUB_TOKEN }} --source "github"

      - name: Add comment for NuGet packages
        uses: mshick/add-pr-comment@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          message: |
            NuGet packages for this PR, e.g. Cratis.Arc:
            https://github.com/cratis/arc/packages/1655206?version=${{ needs.release.outputs.version }}
          allow-repeats: false

  publish-npm-packages:
    if: needs.release.outputs.publish == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup node v16
        uses: actions/setup-node@v4
        with:
          node-version: 16.x
          registry-url: "https://registry.npmjs.org"


      # - uses: actions/cache@v3
      #   id: yarn-cache
      #   with:
      #     path: |
      #       .yarn/cache
      #       **/node_modules
      #       **/.eslintcache
      #       **/yarn.lock
      #     key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
  
      # - name: Yarn install
      #   run: yarn

      # - name: Publish NPM packages
      #   env:
      #     NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: |
      #     yarn publish-version ${{ needs.release.outputs.version }}

      - name: Git reset (package.json files changed)
        run: |
          git reset --hard
