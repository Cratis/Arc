name: Warm Caches

# Pull request workflows only restore the shared NuGet and Yarn caches (Cratis/Workflows dotnet-cache and
# yarn-cache), and a cache saved on main is the one every pull request can restore. Publish only restores them, so
# this is the one place that saves them: whenever what they are keyed on changes on main, and nightly so they are
# not evicted. On an exact hit there is nothing to save, so the restore and install are skipped.
on:
  push:
    branches: [main]
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - "**/[Nn]u[Gg]et.[Cc]onfig"
      - "*.slnx"
      - "global.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/warm-caches.yml"
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  DOTNET10_VERSION: "10.0.x"
  DOTNET11_VERSION: "11.0.x"

jobs:
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same SDKs as the build, so the restore downloads exactly the packages the build needs.
      - name: Setup .Net 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET10_VERSION }}

      - name: Setup .Net 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET11_VERSION }}

      - name: NuGet cache
        id: nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          # On an exact-key miss, start from an empty package folder so the saved cache holds only the
          # versions this restore needs, not every older version the prefix fallback brought back.
          prune-on-miss: 'true'

      # Release, as the build.
      - name: Restore every project
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore --property:Configuration=Release

  yarn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x

      - name: Enable corepack
        run: corepack enable

      - name: Yarn cache
        id: yarn
        uses: Cratis/Workflows/.github/actions/yarn-cache@main

      - name: Yarn install
        if: steps.yarn.outputs.cache-hit != 'true'
        run: yarn install --immutable
