name: Publish

# Keyed by the pull request, never by a value that several simultaneously-closing pull requests share, for the
# same reason pull-requests.yml is. Merging a consolidation closes every pull request whose commits it carries,
# each of those fires its own pull_request:closed event, and on a shared group cancel-in-progress means the last
# run to start cancels the rest — including the one that was supposed to cut the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    types: [closed]
    # Only a pull request into main releases. On "**" every base branch released, so merging one pull
    # request into another one's branch - the ordinary way to stack work - cut and published a version
    # from a branch that was still in review. That is how Cratis.Fundamentals v7.17.0 came to be
    # published from the head of an open pull request, carrying every unmerged change on that branch
    # under release notes describing only the one that had just merged. A release must come from the
    # branch that is released.
    branches:
      - main
    paths:
      - "Source/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "Directory.Packages.*.props"
      - "package.json"
      - "global.json"

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    # A pull request closed without merging has nothing to release. Skipping early also keeps those runs from
    # doing any work at all, on top of the concurrency key above keeping them out of each other's way.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  publish-npm-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm for OIDC-based publishing
        run: |
          # setup-node writes a placeholder _authToken (XXXXX-XXXXX-XXXXX-XXXXX) into
          # .npmrc and exports NODE_AUTH_TOKEN with the same placeholder. npm uses this
          # token as-is for registry auth → 404. Remove it so npm falls back to OIDC.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "--- .npmrc after stripping placeholder ---"
          cat "$NPM_CONFIG_USERCONFIG"

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: |
          npm install -g npm@11
          NPM_VER="$(npm --version)"
          echo "Installed npm $NPM_VER"
          node -e "
            const v = '$NPM_VER'.split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) {
              console.error('npm >= 11.5.1 is required for trusted publishing, got $NPM_VER');
              process.exit(1);
            }
          "

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Publish NPM packages
        run: |
          echo "npm $(npm --version) | node $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL is $([ -n \"$ACTIONS_ID_TOKEN_REQUEST_URL\" ] && echo 'set' || echo 'NOT set')"
          echo "NODE_AUTH_TOKEN is '${NODE_AUTH_TOKEN:-(unset)}'"
          echo "--- .npmrc ---"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no .npmrc)"
          echo "---"
          yarn build
          yarn publish-version ${{ needs.release.outputs.version }}

      - name: Git reset (package.json files changed)
        run: |
          git reset --hard

      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/documentation
          event-type: build-docs

      - name: Trigger Dependency Updates on Sample Repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/samples
          event-type: update-dependencies

          
  verify-published:
    # A merged pull request that publishes nothing is the failure mode that silently costs a release: the release
    # job succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did. workflow_dispatch is excluded
    # because a manual run may legitimately resolve to no publish.
    if: always() && github.event_name == 'pull_request' && needs.release.result == 'success' && needs.release.outputs.publish != 'true'
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::The release action reported should-publish: false for a merged pull request, so no packages were published and no release was cut. The usual cause is a missing major, minor or patch label - see verify-semver-label."
          exit 1
