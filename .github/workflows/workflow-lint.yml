name: Workflow Lint

# Called from pull-requests.yml; the PR triggers and path filters live there.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    uses: Cratis/Workflows/.github/workflows/workflow-lint.yml@main

  chronicle-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x
      - name: Check Chronicle inputs
        run: node --test scripts/chronicle-published-inputs.test.mjs
