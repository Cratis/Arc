name: Verify Pull Request Policy

# Called from pull-requests.yml; the PR triggers and path filters live there.
on:
  workflow_call:
  push:
    branches: [main]

concurrency:
  # Per caller run: a label-only run must not cancel the policy check of the code run on the same pull request.
  group: verify-pull-request-policy-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: Cratis/Workflows/.github/workflows/verify-pull-request-policy.yml@main
    with:
      runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
      release-intent: true
