name: Broken fixture
on:
  workflow_call:
    inputs:
      declared:
        type: string
concurrency:
  group: fixture
  invalid-key: true
jobs:
  check:
    needs: missing-job
    runs-on: ubuntu-latest
    steps:
      - run: echo fixture
        env:
          UNDEFINED: ${{ inputs.nope }}
