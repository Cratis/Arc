name: Trim/AOT Ratchet

# Arc.Core, Arc, MongoDB, EntityFrameworkCore and Chronicle (the projects importing Source/DotNET/AotAnalysis.props)
# are not trim or NativeAOT compatible yet (#2204). Until they are, this holds the analyzer
# diagnostics they report to Source/DotNET/aot-baseline.json so the count can only go down: a pull request that
# adds a diagnostic or a trim/AOT suppression fails, and one that removes diagnostics has to shrink the baseline
# with it. See scripts/aot-ratchet.py and #2859.

# Pull requests gate the baseline. main only takes pull requests, so a run on every push repeated a check that had
# just passed; the nightly run still shows drift from the base (an SDK or package change) within a day.
on:
  schedule:
    - cron: "46 3 * * *"
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Samples/ArcCore/**"
      - "Samples/Shared/**"
      - "Samples/ArcCore.Specs/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages*.props"
      - ".editorconfig"
      - "**/.editorconfig"
      - ".globalconfig"
      - "global.json"
      - "scripts/aot-ratchet.py"
      - ".github/workflows/aot-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aot-ratchet:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The default pull_request ref is the merge result, which is what the exact-match baseline must hold for.
          persist-credentials: false

      # The trim analyzer ships with the SDK, so what it reports can change between SDK releases. Use the SDK
      # global.json names (10.0 builds every target framework); the baseline records the version it was made with.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK
        run: dotnet --version

      # Read the shared NuGet cache warm-caches.yml saves on main. Restore only: this job restores a subset of the
      # packages, and pull request code must never save or replace a shared cache entry.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Self-test the ratchet
        run: python3 scripts/aot-ratchet.py --self-test

      - name: Hold trim/AOT diagnostics to the baseline
        run: python3 scripts/aot-ratchet.py

  published-arc-core:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [Untrimmed]
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
      PUBLISH_VARIANT: ${{ matrix.variant }}
      ACCEPTANCE_ROOT: ${{ runner.temp }}/arc-3595
      CRATIS_ARC_PUBLISHED_ARCCORE: ${{ runner.temp }}/arc-3595/publish/ArcCore
      CRATIS_ARC_PUBLISHED_ARCCORE_LOG: ${{ runner.temp }}/arc-3595/application.log

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Prepare acceptance output
        run: mkdir -p "$ACCEPTANCE_ROOT"

      - name: Publish ArcCore
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Samples/ArcCore/ArcCore.csproj -c Release -f net10.0 -r linux-x64 -p:CratisSamplePublish="$PUBLISH_VARIANT" -o "$ACCEPTANCE_ROOT/publish" > "$ACCEPTANCE_ROOT/publish.log" 2>&1

      - name: Record published image size
        run: du -sk "$ACCEPTANCE_ROOT/publish" "$CRATIS_ARC_PUBLISHED_ARCCORE"

      - name: Build acceptance runner
        run: dotnet build Samples/ArcCore.Specs/ArcCore.Specs.csproj --configuration Release -p:CratisSpecsTargetFramework=net10.0

      - name: Exercise published HTTP commands and queries
        run: Samples/ArcCore.Specs/bin/Release/net10.0/Cratis.Arc.Samples.ArcCore.Specs -noLogo -noColor -failSkips -result-trx "$ACCEPTANCE_ROOT/acceptance.trx"

      - name: Require all acceptance facts to pass without skips
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const trx = fs.readFileSync(`${process.env.ACCEPTANCE_ROOT}/acceptance.trx`, 'utf8');
          const counters = trx.match(/<(?:\w+:)?Counters\b[^>]*>/)?.[0];
          assert.ok(counters, 'Acceptance TRX must contain counters');
          for (const [name, count] of Object.entries({ total: 12, executed: 12, passed: 12, failed: 0, notExecuted: 0 })) {
            assert.match(counters, new RegExp(`\\b${name}="${count}"`), `Expected ${name}=${count}`);
          }
          const results = trx.match(/<(?:\w+:)?UnitTestResult\b[^>]*>/g) ?? [];
          assert.equal(results.length, 12, 'Expected all 12 HTTP acceptance facts');
          for (const result of results) assert.match(result, /\boutcome="Passed"/);
          console.log('Checked 12 acceptance facts: 12 passed, 0 skipped');
          NODE

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-arc-core-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/arc-3595/*.log
            ${{ runner.temp }}/arc-3595/*.trx
          if-no-files-found: warn
