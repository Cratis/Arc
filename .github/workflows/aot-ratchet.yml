name: Trim/AOT Ratchet

# Arc.Core, Arc, MongoDB, EntityFrameworkCore and Chronicle (the projects importing Source/DotNET/AotAnalysis.props)
# are not trim or NativeAOT compatible yet (#2204). Until they are, this holds the analyzer
# diagnostics they report to Source/DotNET/aot-baseline.json so the count can only go down: a pull request that
# adds a diagnostic or a trim/AOT suppression fails, and one that removes diagnostics has to shrink the baseline
# with it. See scripts/aot-ratchet.py and #2859.

on:
  push:
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages*.props"
      - ".editorconfig"
      - "**/.editorconfig"
      - ".globalconfig"
      - "global.json"
      - "scripts/aot-ratchet.py"
      - ".github/workflows/aot-ratchet.yml"
  pull_request:
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages*.props"
      - ".editorconfig"
      - "**/.editorconfig"
      - ".globalconfig"
      - "global.json"
      - "scripts/aot-ratchet.py"
      - ".github/workflows/aot-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aot-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The default pull_request ref is the merge result, which is what the exact-match baseline must hold for.
          persist-credentials: false

      # The trim analyzer ships with the SDK, so what it reports can change between SDK releases. Use the SDK
      # global.json names (10.0 builds every target framework); the baseline records the version it was made with.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK
        run: dotnet --version

      # Read an existing dependency cache without allowing pull-request code to
      # save or replace a shared cache entry.
      - name: Restore NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Self-test the ratchet
        run: python3 scripts/aot-ratchet.py --self-test

      - name: Hold trim/AOT diagnostics to the baseline
        run: python3 scripts/aot-ratchet.py
