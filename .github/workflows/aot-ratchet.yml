name: Trim/AOT Ratchet

# Arc.Core, Arc, MongoDB, EntityFrameworkCore and Chronicle (the projects importing Source/DotNET/AotAnalysis.props)
# are not trim or NativeAOT compatible yet (#2204). Until they are, this holds the analyzer
# diagnostics they report to Source/DotNET/aot-baseline.json so the count can only go down: a pull request that
# adds a diagnostic or a trim/AOT suppression fails, and one that removes diagnostics has to shrink the baseline
# with it. See scripts/aot-ratchet.py and #2859.

# Pull requests gate the baseline. main only takes pull requests, so a run on every push repeated a check that had
# just passed; the nightly run still shows drift from the base (an SDK or package change) within a day.
on:
  schedule:
    - cron: "46 3 * * *"
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Samples/ArcCore/**"
      - "Samples/Shared/**"
      - "Samples/ArcCore.Specs/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages*.props"
      - ".editorconfig"
      - "**/.editorconfig"
      - ".globalconfig"
      - "global.json"
      - "scripts/aot-ratchet.py"
      - "scripts/published-arccore-outcomes*.mjs"
      - ".github/workflows/aot-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aot-ratchet:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default pull_request ref is the merge result, which is what the exact-match baseline must hold for.
          persist-credentials: false

      # The trim analyzer ships with the SDK, so what it reports can change between SDK releases. Use the SDK
      # global.json names (the 11.0 SDK builds every target framework); the baseline records the version it was made with.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show SDK
        run: dotnet --version

      # Read the shared NuGet cache warm-caches.yml saves on main. Restore only: this job restores a subset of the
      # packages, and pull request code must never save or replace a shared cache entry.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Self-test the ratchet
        run: python3 scripts/aot-ratchet.py --self-test

      - name: Hold trim/AOT diagnostics to the baseline
        run: python3 scripts/aot-ratchet.py

  published-arc-core:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Trimmed is excluded until the ILLink IL1012 crash is fixed (dotnet/runtime#136383; Arc#3595).
        variant: [Untrimmed, NativeAot]
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
      PUBLISH_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # main
        with:
          mode: restore

      - name: Install NativeAOT prerequisites when missing
        if: matrix.variant == 'NativeAot'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang > /dev/null || ! dpkg -s zlib1g-dev > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          fi

      - name: Prepare acceptance output
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/arc-3595"
          mkdir -p "$root"
          {
            echo "ACCEPTANCE_ROOT=$root"
            echo "CRATIS_ARC_PUBLISHED_ARCCORE=$root/publish/ArcCore"
            echo "CRATIS_ARC_PUBLISHED_ARCCORE_LOG=$root/application.log"
          } >> "$GITHUB_ENV"

      - name: Read published outcome baseline from the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Checkout does not persist credentials; this public repository supports anonymous HTTPS fetches.
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          manifest="origin/$BASE_REF:Samples/ArcCore.Specs/published-outcomes.json"
          # The first introduction has no base file to compare against.
          if git cat-file -e "$manifest" 2>/dev/null; then
            git show "$manifest" > "$ACCEPTANCE_ROOT/base-manifest.json"
            echo "BASE_MANIFEST=$ACCEPTANCE_ROOT/base-manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Publish ArcCore
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Samples/ArcCore/ArcCore.csproj -c Release -f net11.0 -r linux-x64 -p:CratisSamplePublish="$PUBLISH_VARIANT" -o "$ACCEPTANCE_ROOT/publish" > "$ACCEPTANCE_ROOT/publish.log" 2>&1

      - name: Summarise publish warnings
        if: always()
        continue-on-error: true # Informational trend, not a warnings-as-errors gate yet.
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = `${process.env.ACCEPTANCE_ROOT}/publish.log`;
          const counts = new Map();
          if (existsSync(path)) {
            for (const code of readFileSync(path, 'utf8').match(/warning IL[0-9]+/g) ?? []) {
              counts.set(code, (counts.get(code) ?? 0) + 1);
            }
          }
          const lines = [...counts].sort(([a], [b]) => a.localeCompare(b)).map(([code, count]) => `- ${code}: ${count}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${process.env.PUBLISH_VARIANT} publish warnings\n\n${lines.join('\n') || 'No IL warnings recorded (see publish log for publish status).'}\n\n`);
          NODE

      - name: Record published image size
        run: du -sk "$ACCEPTANCE_ROOT/publish" "$CRATIS_ARC_PUBLISHED_ARCCORE"

      - name: Build acceptance runner
        run: dotnet build Samples/ArcCore.Specs/ArcCore.Specs.csproj --configuration Release -p:CratisSpecsTargetFramework=net11.0

      - name: Exercise published HTTP commands and queries
        shell: bash
        run: |
          set +e
          Samples/ArcCore.Specs/bin/Release/net11.0/Cratis.Arc.Samples.ArcCore.Specs -noLogo -noColor -failSkips -result-trx "$ACCEPTANCE_ROOT/acceptance.trx"
          status=$?
          printf 'Acceptance runner exit: %s\n' "$status" | tee "$ACCEPTANCE_ROOT/runner-exit.log"
          # The checker below owns the verdict, including missing TRX and skips.
          exit 0

      - name: Self-test the published outcome checker
        run: node --test scripts/published-arccore-outcomes.test.mjs

      - name: Hold acceptance facts to tracked outcomes without skips
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${BASE_MANIFEST:-}" ]]; then
            args+=(--base-manifest "$BASE_MANIFEST")
          fi
          node scripts/published-arccore-outcomes.mjs --trx "$ACCEPTANCE_ROOT/acceptance.trx" --variant "$PUBLISH_VARIANT" "${args[@]}"

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-arc-core-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/arc-3595/*.log
            ${{ runner.temp }}/arc-3595/*.trx
          if-no-files-found: warn
