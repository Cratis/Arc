name: Package Graph Verification

# Pull requests run this only when they change what gets packed: project files, build and package props, the
# generators, analyzers and code fixes the packed consumers exercise, the meta-packages and the embedded viewer.
# Every merge to main runs it in full, so a package-graph break from any other change shows up right after it lands.
on:
  push:
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "global.json"
      - "stylecop.json"
      - "Arc.slnx"
      - ".github/workflows/package-graph-verification.yml"
  pull_request:
    # Draft PRs wait until they are marked ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "Source/DotNET/**/*.csproj"
      - "Source/DotNET/**/*.props"
      - "Source/DotNET/**/*.targets"
      - "Source/DotNET/*Generators*/**"
      - "Source/DotNET/*CodeAnalysis*/**"
      # Compiled into the generators and analyzers through linked <Compile> items.
      - "Source/DotNET/Shared/**"
      - "Source/DotNET/Cratis/**"
      - "Source/DotNET/Cratis.Testing/**"
      - "Source/DotNET/Screenplay.Embedded/**"
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "global.json"
      - "stylecop.json"
      - "Arc.slnx"
      - ".github/workflows/package-graph-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-graph:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      # Read the shared NuGet cache warm-caches.yml saves on main. Restore only: this job restores a subset of the
      # packages, and pull request code must never save or replace a shared cache entry.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x

      # The Screenplay.Embedded package carries the built event-model viewer and refuses to
      # pack without it.
      - name: Build embedded event-model viewer
        working-directory: Source/DotNET/Screenplay.Embedded
        run: |
          npm ci --workspaces=false
          npm run build

      - name: Build package graph outputs
        run: |
          dotnet build Source/DotNET/Cratis/Cratis.csproj --configuration Release
          dotnet build Source/DotNET/Cratis.CodeAnalysis/Cratis.CodeAnalysis.csproj --configuration Release
          dotnet build Source/DotNET/Arc.Core.Generators.Integration/Specs/PackageGraph.Integration.csproj --configuration Release --framework net11.0

      - name: Verify packed consumers and code-fix hosts
        run: >-
          dotnet
          Source/DotNET/Arc.Core.Generators.Integration/Specs/bin/Release/net11.0/Cratis.Arc.Core.Generators.Integration.Specs.dll
          -noLogo
          -noColor
