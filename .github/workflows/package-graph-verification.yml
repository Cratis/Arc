name: Package Graph Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "Source/DotNET/**"
      - "Directory.Build.props"
      - "Directory.Packages*.props"
      - "global.json"
      - "stylecop.json"
      - "Arc.slnx"
      - ".github/workflows/package-graph-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.407
            9.0.x
            10.0.x

      # Read an existing dependency cache without allowing pull-request code to
      # save or replace a shared cache entry.
      - name: Restore NuGet packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build package graph outputs
        run: |
          dotnet build Source/DotNET/Cratis/Cratis.csproj --configuration Release
          dotnet build Source/DotNET/Cratis.CodeAnalysis/Cratis.CodeAnalysis.csproj --configuration Release
          dotnet build Source/DotNET/Arc.Core.Generators.Integration/Specs/PackageGraph.Integration.csproj --configuration Release --framework net10.0

      - name: Verify packed consumers and code-fix hosts
        run: >-
          dotnet test
          Source/DotNET/Arc.Core.Generators.Integration/Specs/PackageGraph.Integration.csproj
          --no-build
          --configuration Release
          --framework net10.0
          --logger "console;verbosity=normal"
