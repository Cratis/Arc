name: Markdown Verification

# Called from pull-requests.yml; the PR triggers and path filters live there.
concurrency:
  group: markdown-verification-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client-snippets:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      # Restore only: the snippets restore a fraction of the packages, and a pull request must not save a cache.
      # warm-caches.yml saves the shared cache on main.
      - name: Restore NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@main
        with:
          mode: restore

      - name: Compile client snippets
        run: python3 Documentation/validate-client-snippets.py

  markdown-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: 'Documentation/**/*.{md,mdx}'

  link-verification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 23.x

      - name: Validate Starlight authoring
        run: node ./Documentation/verify-authoring.mjs

      # The same script contributors run locally, so that what CI checks and
      # what verify-markdown.sh checks cannot drift apart.
      - name: Check links in Documentation
        run: ./Documentation/verify-links.sh
