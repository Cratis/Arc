nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"

pnpMode: loose

compressionLevel: mixed

plugins:
  - path: .yarn/plugins/plugin-skip-typescript-compat-patch.cjs

enableGlobalCache: false

enableImmutableInstalls: true

yarnPath: .yarn/releases/yarn-4.5.3.cjs
